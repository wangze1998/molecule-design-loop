name: tests

# The skill's scripts and the repo contract. The contract test is the one that
# keeps SKILL.md small and the repo free of local paths, so it runs on every push.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          channels: conda-forge
          auto-activate-base: false
          activate-environment: test

      - name: Install dependencies
        shell: bash -el {0}
        run: conda install -y -q rdkit pyyaml pytest

      - name: Run tests
        shell: bash -el {0}
        run: python -m pytest molecule-design-loop/scripts -q
